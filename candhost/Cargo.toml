[package]
name = "candhost"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "MultilangIME-CandWin"
path = "src/main.rs"

[dependencies]
ipc = { version = "0.1.0", path = "../ipc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
