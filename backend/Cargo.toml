[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
ipc = { version = "0.1.0", path = "../ipc" }
mozc = { version = "0.1.0", path = "../mozc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }
