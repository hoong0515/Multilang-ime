[package]
name = "tip"
version = "0.1.0"
edition = "2024"

[lib]
name = "multilang_tip"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
windows-core = "0.62"

[profile.release]
panic = "abort"
lto = true
