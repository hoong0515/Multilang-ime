[package]
name = "tip"
version = "0.1.0"
edition = "2024"

[lib]
name = "multilang_tip"
crate-type = ["cdylib"]

[dependencies]
ipc = { version = "0.1.0", path = "../ipc" }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_UI_Shell"] }
windows-core = "0.62"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(candhost)"] }

[build-dependencies]
embed-resource = "3"
